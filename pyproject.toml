[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paypy"
version = "0.2.0"
description = "Unofficial PayPay (jp.ne.paypay) Python API wrapper — full BFF coverage plus a PayPayOpenPy-compatible high-level surface."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "u_pa_" }]
keywords = ["paypay", "p2p", "wallet", "unofficial", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/amane1201/paypy"
Repository = "https://github.com/amane1201/paypy"
Issues = "https://github.com/amane1201/paypy/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[tool.setuptools.packages.find]
where = ["."]
include = ["paypy*"]
